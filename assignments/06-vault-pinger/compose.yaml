services:
  postgres:
    image: rsp-postgres:18
    build:
      context: ./db
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: rsp
      POSTGRES_USER: postgres
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8
        --locale=ru_RU.UTF-8
        --auth-host=scram-sha-256
        --auth-local=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rsp"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  vault:
    image: hashicorp/vault:2.1.1
    cap_add:
      - IPC_LOCK
    environment:
      # token read from .env
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./vault/file:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped


  vault-init:
    image: hashicorp/vault:2.1.1
    user: "0"
    env_file:
      - ./.env
    environment:
      VAULT_ADDR: http://vault:8200
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      # copy for init.sh
      - ./vault:/vault/config:ro
      - vault-credentials:/vault/credentials
    entrypoint: ["/bin/sh", "/vault/config/init.sh"]
    restart: "no"

  pinger:
    image: rsp-vault-pinger:1.0.0
    build:
      context: ./app
    environment:
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      LOG_FILE: ${LOG_FILE:-/logs/pinger.log}
      VAULT_ADDR: http://vault:8200
      VAULT_MOUNT_POINT: secret
      VAULT_SECRET_PATH: pinger/database
      VAULT_TIMEOUT_SECONDS: 5
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-credentials:/vault-credentials:ro
      - pinger-logs:/logs
    restart: unless-stopped

volumes:
  postgres-data:
  vault-credentials:
  pinger-logs:
